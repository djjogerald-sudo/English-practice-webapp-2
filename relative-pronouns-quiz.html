  // Parser: Extract metadata and array of questions
  function parseTSV(quizPkg) {
    const lines = quizPkg.rawTSVData.trim().split('\n');
    const questions = lines.map(line => {
      const parts = line.split('\t');
      return {
        question: parts[0]?.trim() || '',
        topic: parts[1]?.trim() || 'Grammar',
        level: parts[2]?.trim() || 'A2',
        explanation: parts[3]?.trim() || '',
        correctOptionIndex: parseInt(parts[4]?.trim(), 10) - 1,
        options: [
          parts[5]?.trim(),
          parts[6]?.trim(),
          parts[7]?.trim(),
          parts[8]?.trim()
        ].filter(Boolean)
      };
    });

    return {
      title: quizPkg.quizName,
      questions: questions
    };
  }

  // Quiz Engine Logic
  class QuizEngine {
    constructor(quizData) {
      this.title = quizData.title;
      this.questions = quizData.questions;
      this.currentIndex = 0;
      this.score = 0;
      this.hasAnswered = false;

      // DOM Handles
      this.quizNameEl = document.getElementById('quiz-name');
      this.uiQuiz = document.getElementById('quiz-ui');
      this.uiResults = document.getElementById('results-ui');
      this.topicBadge = document.getElementById('topic-badge');
      this.levelBadge = document.getElementById('level-badge');
      this.counter = document.getElementById('counter');
      this.progress = document.getElementById('progress');
      this.questionText = document.getElementById('question-text');
      this.optionsContainer = document.getElementById('options-container');
      this.explanation = document.getElementById('explanation');
      this.nextBtn = document.getElementById('next-btn');

      this.nextBtn.addEventListener('click', () => this.nextQuestion());
      
      // Initialize Title and View
      this.quizNameEl.textContent = this.title;
      this.render();
    }

    getCurrentQuestion() {
      return this.questions[this.currentIndex];
    }

    render() {
      this.hasAnswered = false;
      const q = this.getCurrentQuestion();

      this.topicBadge.textContent = q.topic;
      this.levelBadge.textContent = q.level;
      this.counter.textContent = `${this.currentIndex + 1} / ${this.questions.length}`;
      this.progress.style.width = `${((this.currentIndex) / this.questions.length) * 100}%`;
      
      this.questionText.innerHTML = q.question;
      this.explanation.style.display = 'none';
      this.nextBtn.style.display = 'none';
      this.optionsContainer.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => this.handleAnswer(index, btn));
        this.optionsContainer.appendChild(btn);
      });
    }

    handleAnswer(selectedIndex, selectedBtn) {
      if (this.hasAnswered) return;
      this.hasAnswered = true;

      const q = this.getCurrentQuestion();
      const buttons = this.optionsContainer.querySelectorAll('.option-btn');

      if (selectedIndex === q.correctOptionIndex) {
        selectedBtn.classList.add('correct');
        this.score++;
      } else {
        selectedBtn.classList.add('incorrect');
        buttons[q.correctOptionIndex].classList.add('correct');
      }

      buttons.forEach(btn => btn.disabled = true);

      if (q.explanation) {
        this.explanation.innerHTML = q.explanation;
        this.explanation.style.display = 'block';
      }

      this.nextBtn.style.display = 'inline-block';
    }

    nextQuestion() {
      this.currentIndex++;
      if (this.currentIndex < this.questions.length) {
        this.render();
      } else {
        this.showResults();
      }
    }

    showResults() {
      this.uiQuiz.style.display = 'none';
      this.uiResults.style.display = 'block';

      const percentage = Math.round((this.score / this.questions.length) * 100);
      document.getElementById('score').textContent = `${percentage}%`;
      document.getElementById('score-details').textContent = 
        `You answered ${this.score} out of ${this.questions.length} questions correctly.`;
    }
  }

  const quizData = parseTSV(quizPackage);
  new QuizEngine(quizData);
</script>
